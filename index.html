<script>
    // ====== FIREBASE CONFIGURATION ======
    const firebaseConfig = {
        apiKey: "AIzaSyAjir7zq8PIzXbDZqfvpRvoWqqYd9udnTU",
        authDomain: "gas-tracker-8e098.firebaseapp.com",
        projectId: "gas-tracker-8e098",
        storageBucket: "gas-tracker-8e098.firebasestorage.app",
        messagingSenderId: "265524187379",
        appId: "1:265524187379:web:d987da967ae8aadc582786"
    };
    const vapidKey = "BJC2ztNWs-SjxdEbdmy9_6XRhjhSW6JDlLhQu77vkgAMwWfyIGZTwWo-DewsBmmITfNRvj5Mek1MpkJd0I7Bioo";

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();

    // ====== APP STATE ======
    let savedDates = null;
    let audioContext = null;
    let isFirebaseReady = false;

    // DOM Elements
    const countdownEl = document.getElementById('countdown');
    const countdownLabelEl = document.getElementById('countdownLabel');
    const statusIndicator = document.getElementById('statusIndicator');
    const notificationList = document.getElementById('notificationList');
    const refillDateInput = document.getElementById('refillDate');
    const consumptionDateInput = document.getElementById('consumptionDate');
    const notifPermission = document.getElementById('notifPermission');

    // Request permission and subscribe to push
    async function requestPermission() {
        try {
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                notifPermission.style.display = 'none';
                showToast('Notifications enabled!');
                await subscribeToPush();
            } else {
                showToast('Notifications denied.');
            }
        } catch (err) {
            console.error('Permission error:', err);
            showToast('Error requesting permission.');
        }
    }

    // Subscribe to Firebase Cloud Messaging
    async function subscribeToPush() {
        try {
            const registration = await navigator.serviceWorker.ready;
            const token = await messaging.getToken({
                vapidKey: vapidKey,
                serviceWorkerRegistration: registration
            });
            console.log('FCM Token:', token);
            showToast('Push notifications subscribed!');
            isFirebaseReady = true;
        } catch (err) {
            console.error('Push subscription failed:', err);
            showToast('Push subscription failed. Check Firebase config.');
        }
    }

    // Handle incoming messages when app is in foreground
    messaging.onMessage((payload) => {
        console.log('Message received:', payload);
        const { title, body } = payload.notification;
        new Notification(title, { body: body });
        playAlarm();
    });

    // Save dates
    function saveDates() {
        const refill = refillDateInput.value;
        const consumption = consumptionDateInput.value;

        if (!refill || !consumption) {
            showToast('Please select both dates');
            return;
        }

        savedDates = {
            refill: new Date(refill),
            consumption: new Date(consumption)
        };

        showToast('Dates saved! Notifications will be set.');
        updateStatus();
        checkNotifications();
    }

    // Update status based on days left
    function updateStatus() {
        if (!savedDates) {
            countdownEl.textContent = '--';
            countdownLabelEl.textContent = 'Set dates to see countdown';
            statusIndicator.className = 'status-indicator';
            statusIndicator.textContent = 'Please set your consumption date';
            return;
        }

        const today = new Date();
        today.setHours(0,0,0,0);
        const consumption = savedDates.consumption;
        consumption.setHours(0,0,0,0);

        const diffDays = Math.ceil((consumption - today) / (1000 * 60 * 60 * 24));

        countdownEl.textContent = diffDays >= 0 ? diffDays : 0;
        countdownLabelEl.textContent = diffDays === 1 ? 'day until consumption' : 'days until consumption';

        statusIndicator.className = 'status-indicator';

        if (diffDays < 0) {
            statusIndicator.classList.add('status-danger');
            statusIndicator.textContent = '⏰ Consumption date has passed! Refill now.';
        } else if (diffDays === 0) {
            statusIndicator.classList.add('status-danger');
            statusIndicator.textContent = '⚠️ Today is the consumption date! Refill now.';
        } else if (diffDays <= 2) {
            statusIndicator.classList.add('status-warning');
            statusIndicator.textContent = `🔥 Only ${diffDays} day${diffDays === 1 ? '' : 's'} left!`;
        } else {
            statusIndicator.classList.add('status-ok');
            statusIndicator.textContent = '✅ You have enough time';
        }
    }

    // Notification checking
    function checkNotifications() {
        if (!savedDates) {
            notificationList.innerHTML = '<div class="notification-item alert-none"><span class="icon">ℹ️</span> Set your consumption date to see alerts</div>';
            return;
        }

        const today = new Date();
        today.setHours(0,0,0,0);
        const consumption = savedDates.consumption;
        consumption.setHours(0,0,0,0);

        const diffDays = Math.ceil((consumption - today) / (1000 * 60 * 60 * 24));

        let html = '';

        if (diffDays < 0) {
            html = '<div class="notification-item alert-today"><span class="icon">⏰</span> Consumption date has passed! Please refill.</div>';
        } else if (diffDays === 0) {
            html = '<div class="notification-item alert-today"><span class="icon">⏰</span> Today is the consumption date! Refill now.</div>';
            playAlarm();
            sendNotification('Gas Cylinder Alert', 'Today is the consumption date! Refill now.');
        } else if (diffDays === 1) {
            html = '<div class="notification-item alert-1day"><span class="icon">⚠️</span> 1 day left until consumption date!</div>';
            playAlarm();
            sendNotification('Gas Cylinder Alert', '1 day left until consumption date!');
        } else if (diffDays === 2) {
            html = '<div class="notification-item alert-2days"><span class="icon">📅</span> 2 days left until consumption date!</div>';
            playAlarm();
            sendNotification('Gas Cylinder Alert', '2 days left until consumption date!');
        } else {
            html = `<div class="notification-item alert-none"><span class="icon">✅</span> ${diffDays} days left until consumption date.</div>`;
        }

        const refillDiff = Math.ceil((savedDates.refill - today) / (1000 * 60 * 60 * 24));
        if (refillDiff >= 0) {
            html += `<div class="notification-item alert-none"><span class="icon">🔄</span> Refill date is in ${refillDiff} days.</div>`;
        }

        notificationList.innerHTML = html;
    }

    // Send notification (local fallback)
    function sendNotification(title, message) {
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(title, { body: message });
        }
    }

    // Alarm sound using Web Audio API
    function playAlarm() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.frequency.value = 800;
        oscillator.type = 'sine';

        for (let i = 0; i < 3; i++) {
            gainNode.gain.setValueAtTime(0, now + i * 0.3);
            gainNode.gain.linearRampToValueAtTime(1, now + i * 0.3 + 0.01);
            gainNode.gain.linearRampToValueAtTime(0, now + i * 0.3 + 0.2);
        }

        oscillator.start(now);
        oscillator.stop(now + 1);
    }

    // Toast
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Initialize
    if ('Notification' in window && Notification.permission === 'granted') {
        notifPermission.style.display = 'none';
        subscribeToPush();
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
            .then(reg => console.log('SW registered', reg))
            .catch(err => console.error('SW registration failed', err));
    }

    updateStatus();
    checkNotifications();

    setInterval(() => {
        updateStatus();
        checkNotifications();
    }, 60000);
</script>
