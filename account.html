<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | Cooking Gas Tracker & Manager</title>
<meta name="description" content="Manage your Cooking Gas Tracker & Manager account.">

<style>
:root{
  --purple:#6d28d9;
  --purple-dark:#4c1d95;
  --purple-soft:#f5f0ff;
  --text:#171321;
  --muted:#6b6477;
  --card:#ffffff;
  --line:#e9e3f2;
  --bg:#f7f5fb;
  --green:#16a34a;
  --red:#dc2626;
}

*{box-sizing:border-box}

html,body{margin:0;padding:0}

body{
  min-height:100vh;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 8% 8%,rgba(109,40,217,.13),transparent 27%),
    radial-gradient(circle at 92% 18%,rgba(37,99,235,.10),transparent 25%),
    radial-gradient(circle at 45% 100%,rgba(22,163,74,.08),transparent 28%),
    var(--bg);
}

body.dark{
  --text:#f6f2ff;
  --muted:#bdb4cc;
  --card:#17131f;
  --line:#30283d;
  --bg:#0e0b13;
  --purple-soft:#241d36;
  background:
    radial-gradient(circle at 8% 8%,rgba(109,40,217,.22),transparent 27%),
    radial-gradient(circle at 92% 18%,rgba(37,99,235,.15),transparent 25%),
    #0e0b13;
}

button,a{font:inherit}

header{
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(16px);
  background:rgba(255,255,255,.80);
  border-bottom:1px solid rgba(120,90,160,.12);
}

body.dark header{
  background:rgba(14,11,19,.86);
}

.nav{
  max-width:1180px;
  margin:auto;
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:inherit;
  text-decoration:none;
  font-weight:900;
}

.brand img{
  width:44px;
  height:44px;
  object-fit:contain;
  border-radius:12px;
}

.navlinks{
  display:flex;
  gap:6px;
}

.navlinks a{
  color:var(--muted);
  text-decoration:none;
  padding:10px 13px;
  border-radius:12px;
  font-weight:750;
  font-size:14px;
}

.navlinks a:hover{
  background:var(--purple-soft);
  color:var(--purple);
}

.nav-actions{
  display:flex;
  align-items:center;
}

.theme-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  font-size:17px;
}

main{
  width:min(1180px,100%);
  margin:0 auto;
  padding:45px 20px 75px;
}

.hero{
  position:relative;
  overflow:hidden;
  border-radius:30px;
  padding:42px;
  color:#fff;
  background:
    radial-gradient(circle at 12% 15%,rgba(255,255,255,.22),transparent 23%),
    radial-gradient(circle at 88% 80%,rgba(34,197,94,.28),transparent 25%),
    linear-gradient(135deg,#4c1d95,#6d28d9 50%,#2563eb);
  box-shadow:0 22px 60px rgba(76,29,149,.18);
}

.hero:after{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  border:38px solid rgba(255,255,255,.07);
  border-radius:50%;
  right:-80px;
  top:-90px;
  pointer-events:none;
}

.hero-content{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}

.hero-badge{
  display:inline-flex;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.18);
  font-size:12px;
  font-weight:850;
  color:#fff;
}

.hero h1{
  font-size:42px;
  line-height:1.05;
  margin:16px 0 10px;
  letter-spacing:-1.5px;
}

.hero p{
  margin:0;
  color:rgba(255,255,255,.88);
  line-height:1.65;
  max-width:670px;
}

.avatar{
  width:92px;
  height:92px;
  flex:0 0 92px;
  border-radius:28px;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.22);
  display:grid;
  place-items:center;
  font-size:34px;
  font-weight:950;
  backdrop-filter:blur(8px);
}

.grid{
  display:grid;
  grid-template-columns:1.35fr .65fr;
  gap:20px;
  margin-top:22px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:25px;
  box-shadow:0 12px 35px rgba(40,20,70,.06);
}

.card h2{
  font-size:21px;
  margin:0 0 7px;
}

.card-sub{
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
  margin:0 0 20px;
}

.info-list{
  display:grid;
  gap:10px;
}

.info-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:14px 15px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--bg);
}

.info-label{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.info-value{
  font-size:14px;
  font-weight:850;
  text-align:right;
  overflow-wrap:anywhere;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  border-radius:999px;
  background:#f0fdf4;
  color:#15803d;
  font-size:12px;
  font-weight:850;
}

body.dark .status{
  background:#10291a;
  color:#86efac;
}

.actions{
  display:grid;
  gap:10px;
}

.action{
  display:flex;
  align-items:center;
  gap:13px;
  padding:15px;
  border-radius:16px;
  border:1px solid var(--line);
  background:var(--card);
  text-decoration:none;
  color:var(--text);
  transition:.18s;
}

.action:hover{
  transform:translateY(-2px);
  border-color:rgba(109,40,217,.25);
  box-shadow:0 8px 22px rgba(40,20,70,.07);
}

.action-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-size:20px;
  background:var(--purple-soft);
}

.action strong{
  display:block;
  font-size:14px;
  margin-bottom:3px;
}

.action small{
  color:var(--muted);
  font-size:12px;
}

.action-arrow{
  margin-left:auto;
  color:var(--muted);
  font-size:20px;
}

.notice{
  margin-top:20px;
  padding:17px 18px;
  border-radius:17px;
  background:var(--purple-soft);
  border:1px solid rgba(109,40,217,.15);
  line-height:1.6;
  color:var(--muted);
  font-size:13px;
}

.notice strong{
  color:var(--purple);
}

.btn{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-weight:850;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}

.btn-primary{
  background:var(--purple);
  color:#fff;
  box-shadow:0 8px 20px rgba(109,40,217,.20);
}

.btn-primary:hover{
  background:var(--purple-dark);
}

.signout{
  width:100%;
  margin-top:20px;
  background:transparent;
  color:var(--red);
  border:1px solid rgba(220,38,38,.25);
}

.signout:hover{
  background:#fef2f2;
}

body.dark .signout:hover{
  background:#35171a;
}

.loading-screen{
  min-height:65vh;
  display:grid;
  place-items:center;
  color:var(--muted);
  font-weight:700;
}

.loading-box{
  text-align:center;
}

.spinner{
  width:34px;
  height:34px;
  margin:0 auto 12px;
  border:4px solid rgba(109,40,217,.15);
  border-top-color:var(--purple);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.toast{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translate(-50%,20px);
  background:#171321;
  color:#fff;
  padding:13px 17px;
  border-radius:14px;
  font-weight:750;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:50;
  box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:850px){
  .navlinks{display:none}
  .hero{padding:32px}
  .hero-content{align-items:flex-start}
  .hero h1{font-size:35px}
  .grid{grid-template-columns:1fr}
}

@media(max-width:560px){
  main{padding:25px 14px 55px}
  .nav{padding:10px 14px}
  .brand span{display:none}
  .hero{padding:26px 22px;border-radius:24px}
  .hero-content{display:block}
  .avatar{
    margin-top:22px;
    width:70px;
    height:70px;
    min-height:70px;
    border-radius:21px;
    font-size:28px;
  }
  .hero h1{font-size:30px}
  .card{padding:20px;border-radius:20px}
  .info-row{display:block}
  .info-value{text-align:left;margin-top:5px}
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <a class="brand" href="index.html">
      <img src="https://i.imgur.com/QzPFczP.png" alt="Cooking Gas Tracker & Manager">
      <span>Cooking Gas Tracker & Manager</span>
    </a>

    <nav class="navlinks" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="tracker.html">Tracker</a>
      <a href="assistant.html">Assistant</a>
      <a href="guides.html">Guides</a>
      <a href="more.html">More</a>
    </nav>

    <div class="nav-actions">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle theme">🌙</button>
    </div>
  </div>
</header>

<main id="main">
  <div class="loading-screen">
    <div class="loading-box">
      <div class="spinner"></div>
      Loading your account...
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyAjir7zq8PIzXbDZqfvpRvoWqqYd9udnTU",
  authDomain: "gas-tracker-8e098.firebaseapp.com",
  projectId: "gas-tracker-8e098",
  storageBucket: "gas-tracker-8e098.firebasestorage.app",
  messagingSenderId: "265524187379",
  appId: "1:265524187379:web:d987da967ae8aadc582786"
};

const main = document.getElementById("main");
const themeBtn = document.getElementById("themeBtn");
const toast = document.getElementById("toast");

function setThemeIcon(){
  themeBtn.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
}

if(localStorage.getItem("cgtTheme") === "dark"){
  document.body.classList.add("dark");
}

setThemeIcon();

themeBtn.addEventListener("click", function(){
  document.body.classList.toggle("dark");

  localStorage.setItem(
    "cgtTheme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );

  setThemeIcon();
});

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");

  window.clearTimeout(showToast.timer);

  showToast.timer = window.setTimeout(function(){
    toast.classList.remove("show");
  }, 3000);
}

function escapeHtml(value){
  return String(value || "").replace(/[&<>"']/g, function(character){
    const entities = {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    };

    return entities[character];
  });
}

function getInitials(name, email){
  const source = String(name || email || "U").trim();

  if(!source){
    return "U";
  }

  const parts = source.split(/\s+/).filter(Boolean);

  if(parts.length >= 2){
    return (
      parts[0].charAt(0) +
      parts[parts.length - 1].charAt(0)
    ).toUpperCase();
  }

  return source.substring(0, 2).toUpperCase();
}

function showLoading(){
  main.innerHTML = `
    <div class="loading-screen">
      <div class="loading-box">
        <div class="spinner"></div>
        Loading your account...
      </div>
    </div>
  `;
}

function showError(message){
  main.innerHTML = `
    <section class="card" style="max-width:620px;margin:70px auto;text-align:center">
      <div style="font-size:42px;margin-bottom:12px">⚠️</div>
      <h2>We couldn't load your account</h2>
      <p class="card-sub">${escapeHtml(message)}</p>
      <a class="btn btn-primary" href="login.html">Back to Sign In</a>
    </section>
  `;
}

function renderAccount(user){
  const name = user.displayName || "Cooking Gas User";
  const email = user.email || "No email address";
  const verified = user.emailVerified === true;

  let joined = "—";

  if(user.metadata && user.metadata.creationTime){
    const createdDate = new Date(user.metadata.creationTime);

    if(!Number.isNaN(createdDate.getTime())){
      joined = createdDate.toLocaleDateString(undefined, {
        year:"numeric",
        month:"long",
        day:"numeric"
      });
    }
  }

  const firstName = name.trim().split(/\s+/)[0] || "there";
  const avatar = getInitials(name, email);

  main.innerHTML = `
    <section class="hero">
      <div class="hero-content">
        <div>
          <span class="hero-badge">👤 MY ACCOUNT</span>

          <h1>
            Welcome, ${escapeHtml(firstName)}!
          </h1>

          <p>
            Your account is ready. This is your personal home for
            Cooking Gas Tracker & Manager. More connected features
            will be added here as we build the account system.
          </p>
        </div>

        <div class="avatar" aria-label="Account initials">
          ${escapeHtml(avatar)}
        </div>
      </div>
    </section>

    <section class="grid">

      <div>
        <article class="card">
          <h2>Account information</h2>

          <p class="card-sub">
            Your current Firebase account details.
          </p>

          <div class="info-list">

            <div class="info-row">
              <div class="info-label">Full name</div>
              <div class="info-value">
                ${escapeHtml(name)}
              </div>
            </div>

            <div class="info-row">
              <div class="info-label">Email address</div>
              <div class="info-value">
                ${escapeHtml(email)}
              </div>
            </div>

            <div class="info-row">
              <div class="info-label">Email verification</div>
              <div class="info-value">
                ${
                  verified
                  ? '<span class="status">✓ Verified</span>'
                  : '<span class="status" style="background:#fff7ed;color:#c2410c">⚠ Not verified</span>'
                }
              </div>
            </div>

            <div class="info-row">
              <div class="info-label">Member since</div>
              <div class="info-value">
                ${escapeHtml(joined)}
              </div>
            </div>

          </div>

          ${
            verified
            ? ""
            : `
              <div class="notice">
                <strong>Your email is not verified yet.</strong>
                <br>
                Verify your email to help keep your account secure.
                <br>

                <button
                  class="btn btn-primary"
                  id="verifyBtn"
                  type="button"
                  style="margin-top:12px"
                >
                  Send verification email
                </button>
              </div>
            `
          }

          <button
            class="btn signout"
            id="signoutBtn"
            type="button"
          >
            Sign out
          </button>

        </article>
      </div>

      <aside>

        <article class="card">
          <h2>Quick access</h2>

          <p class="card-sub">
            Continue where you want to work.
          </p>

          <div class="actions">

            <a class="action" href="tracker.html">
              <span class="action-icon">🔥</span>
              <span>
                <strong>Gas Tracker</strong>
                <small>Manage your gas usage and reminders.</small>
              </span>
              <span class="action-arrow">›</span>
            </a>

            <a class="action" href="cooking-profile.html">
              <span class="action-icon">👨‍🍳</span>
              <span>
                <strong>Cooking Profile</strong>
                <small>Manage your cooking preferences.</small>
              </span>
              <span class="action-arrow">›</span>
            </a>

            <a class="action" href="meal-planner.html">
              <span class="action-icon">🍲</span>
              <span>
                <strong>Meal Planner</strong>
                <small>Create and manage your meal plans.</small>
              </span>
              <span class="action-arrow">›</span>
            </a>

            <a class="action" href="smart-shopping.html">
              <span class="action-icon">🛒</span>
              <span>
                <strong>Smart Shopping</strong>
                <small>Manage your shopping list.</small>
              </span>
              <span class="action-arrow">›</span>
            </a>

            <a class="action" href="assistant.html">
              <span class="action-icon">✨</span>
              <span>
                <strong>Cooking Gas Assistant</strong>
                <small>Get personalized guidance.</small>
              </span>
              <span class="action-arrow">›</span>
            </a>

          </div>
        </article>

        <div class="notice">
          <strong>What's next?</strong>
          <br>
          Your account is connected to Firebase Authentication.
          We'll use this account foundation when we connect your
          saved tracker data, cooking profile, meal plans and
          notification settings.
        </div>

      </aside>

    </section>
  `;

  const signoutBtn = document.getElementById("signoutBtn");

  signoutBtn.addEventListener("click", async function(){
    signoutBtn.disabled = true;
    signoutBtn.textContent = "Signing out...";

    try{
      await auth.signOut();
      window.location.replace("index.html");
    }catch(error){
      signoutBtn.disabled = false;
      signoutBtn.textContent = "Sign out";
      showToast("Could not sign out. Please try again.");
    }
  });

  const verifyBtn = document.getElementById("verifyBtn");

  if(verifyBtn){
    verifyBtn.addEventListener("click", async function(){
      verifyBtn.disabled = true;
      verifyBtn.textContent = "Sending...";

      try{
        await user.sendEmailVerification();

        verifyBtn.textContent = "Email sent ✓";
        showToast("Verification email sent. Check your inbox.");

      }catch(error){
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Send verification email";

        if(error && error.code === "auth/too-many-requests"){
          showToast("Please wait before requesting another email.");
        }else{
          showToast("We couldn't send the email right now.");
        }
      }
    });
  }
}

let firebaseStarted = false;
let auth = null;

try{
  if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
  }

  auth = firebase.auth();
  firebaseStarted = true;

}catch(error){
  console.error("Firebase initialization error:", error);

  showError(
    "Firebase could not be initialized. Please check your Firebase configuration and try again."
  );
}

if(firebaseStarted && auth){

  auth.onAuthStateChanged(function(user){

    if(!user){
      window.location.replace("login.html");
      return;
    }

    renderAccount(user);
  });

}
</script>

</body>
</html>
