<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | Cooking Gas Tracker & Manager</title>
<meta name="description" content="Manage your Cooking Gas Tracker & Manager account.">
<style>
:root{
  --purple:#6d28d9;--purple-dark:#4c1d95;--purple-soft:#f5f0ff;
  --text:#171321;--muted:#6b6477;--card:#fff;--line:#e9e3f2;--bg:#f7f5fb;
  --green:#16a34a;--blue:#2563eb;--orange:#ea580c;--red:#dc2626;
}
body.dark{
  --text:#f6f2ff;--muted:#bdb4cc;--card:#17131f;--line:#30283d;--bg:#0e0b13;--purple-soft:#241d36
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 8% 8%,rgba(109,40,217,.13),transparent 27%),
    radial-gradient(circle at 92% 18%,rgba(37,99,235,.10),transparent 25%),
    radial-gradient(circle at 45% 100%,rgba(22,163,74,.08),transparent 28%),var(--bg);
  min-height:100vh
}
body.dark{
 background:
  radial-gradient(circle at 8% 8%,rgba(109,40,217,.22),transparent 27%),
  radial-gradient(circle at 92% 18%,rgba(37,99,235,.15),transparent 25%),#0e0b13
}
header{
 position:sticky;top:0;z-index:20;backdrop-filter:blur(16px);
 background:rgba(255,255,255,.78);border-bottom:1px solid rgba(120,90,160,.12)
}
body.dark header{background:rgba(14,11,19,.84)}
.nav{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:900}
.brand img{width:44px;height:44px;object-fit:contain;border-radius:12px}
.navlinks{display:flex;gap:6px}
.navlinks a{color:var(--muted);text-decoration:none;padding:10px 13px;border-radius:12px;font-weight:750;font-size:14px}
.navlinks a:hover{background:var(--purple-soft);color:var(--purple)}
.nav-actions{display:flex;gap:8px;align-items:center}
.btn{
 border:0;border-radius:12px;padding:11px 16px;font-weight:850;cursor:pointer;text-decoration:none;
 display:inline-flex;align-items:center;justify-content:center;gap:7px
}
.btn-primary{background:var(--purple);color:#fff;box-shadow:0 8px 20px rgba(109,40,217,.2)}
.btn-primary:hover{background:var(--purple-dark)}
.btn-outline{background:transparent;color:var(--purple);border:1px solid rgba(109,40,217,.3)}
.theme-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:17px}
main{max-width:1180px;margin:auto;padding:45px 20px 75px}
.hero{
 position:relative;overflow:hidden;border-radius:30px;padding:42px;
 color:#fff;
 background:
  radial-gradient(circle at 12% 15%,rgba(255,255,255,.22),transparent 23%),
  radial-gradient(circle at 88% 80%,rgba(34,197,94,.28),transparent 25%),
  linear-gradient(135deg,#4c1d95,#6d28d9 50%,#2563eb);
 box-shadow:0 22px 60px rgba(76,29,149,.18)
}
.hero:after{
 content:"";position:absolute;width:250px;height:250px;border:38px solid rgba(255,255,255,.07);
 border-radius:50%;right:-80px;top:-90px
}
.hero-content{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:30px}
.hero-badge{display:inline-flex;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);font-size:12px;font-weight:850;letter-spacing:.3px;color:#fff}
.hero h1{font-size:42px;line-height:1.05;margin:16px 0 10px;letter-spacing:-1.5px}
.hero p{margin:0;color:rgba(255,255,255,.88);line-height:1.65;max-width:670px}
.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:20px;margin-top:22px}
.card{
 background:var(--card);border:1px solid var(--line);border-radius:24px;padding:25px;
 box-shadow:0 12px 35px rgba(40,20,70,.06)
}
.card h2{font-size:21px;margin:0 0 7px}
.card-sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 20px}
.info-list{display:grid;gap:10px}
.info-row{
 display:flex;align-items:center;justify-content:space-between;gap:15px;
 padding:14px 15px;border:1px solid var(--line);border-radius:15px;background:var(--bg)
}
.info-label{color:var(--muted);font-size:13px;font-weight:700}
.info-value{font-size:14px;font-weight:850;text-align:right;overflow-wrap:anywhere}
.status{
 display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;
 background:#f0fdf4;color:#15803d;font-size:12px;font-weight:850
}
body.dark .status{background:#10291a;color:#86efac}
.actions{display:grid;gap:10px}
.action{
 display:flex;align-items:center;gap:13px;padding:15px;border-radius:16px;
 border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--text);
 transition:.18s
}
.action:hover{transform:translateY(-2px);border-color:rgba(109,40,217,.25);box-shadow:0 8px 22px rgba(40,20,70,.07)}
.action-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--purple-soft)}
.action strong{display:block;font-size:14px;margin-bottom:3px}
.action small{color:var(--muted);font-size:12px}
.action-arrow{margin-left:auto;color:var(--muted);font-size:20px}
.notice{
 margin-top:20px;padding:17px 18px;border-radius:17px;background:var(--purple-soft);
 border:1px solid rgba(109,40,217,.15);line-height:1.6;color:var(--muted);font-size:13px
}
.notice strong{color:var(--purple)}
.security-card{margin-top:20px}
.security-form{display:grid;gap:12px}
.security-form label{display:block;font-size:13px;font-weight:800;margin:0 0 6px}
.security-form input{width:100%;height:48px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);outline:none;font:inherit}
.security-form input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(109,40,217,.10)}
.security-message{display:none;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5}
.security-message.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.security-message.success{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
body.dark .security-message.error{background:#35171a;color:#fca5a5;border-color:#633036}
body.dark .security-message.success{background:#10291a;color:#86efac;border-color:#1d5530}
.google-managed{padding:14px 15px;border-radius:15px;background:#f8fafc;border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.6}
body.dark .google-managed{background:#111827;color:#cbd5e1}
.signout{
 width:100%;margin-top:20px;background:transparent;color:var(--red);
 border:1px solid rgba(220,38,38,.25)
}
.signout:hover{background:#fef2f2}
body.dark .signout:hover{background:#35171a}
.toast{
 position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
 background:#171321;color:#fff;padding:13px 17px;border-radius:14px;font-weight:750;font-size:13px;
 opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 15px 35px rgba(0,0,0,.2)
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading-screen{min-height:70vh;display:grid;place-items:center;color:var(--muted)}
@media(max-width:850px){
 .navlinks{display:none}.hero{padding:32px}.hero-content{align-items:flex-start}
 .hero h1{font-size:35px}.grid{grid-template-columns:1fr}
}
@media(max-width:560px){
 main{padding:25px 14px 55px}.nav{padding:10px 14px}.brand span{display:block}
 .hero{padding:26px 22px;border-radius:24px}.hero-content{display:block}
 .hero h1{font-size:30px}.card{padding:20px;border-radius:20px}.info-row{display:block}
 .info-value{text-align:left;margin-top:5px}
}

/* =========================================================
   ACCOUNT ACCESS OVERVIEW
========================================================= */

.access-overview{
  margin-top:20px;
  padding:23px;
  border-radius:22px;
  background:
    radial-gradient(circle at 92% 10%,rgba(34,211,238,.10),transparent 25%),
    radial-gradient(circle at 8% 90%,rgba(245,158,11,.10),transparent 26%),
    linear-gradient(145deg,var(--card),var(--purple-soft));
  border:1px solid var(--line);
  box-shadow:0 12px 35px rgba(40,20,70,.05);
}

.access-overview h2{
  margin:0 0 7px;
  font-size:22px;
}

.access-overview > p{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.65;
  max-width:820px;
}

.access-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
  margin-top:17px;
}

.access-item{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:14px;
  border-radius:15px;
  background:var(--card);
  border:1px solid var(--line);
}

.access-item-icon{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:var(--purple-soft);
  font-size:19px;
}

.access-item strong{
  display:block;
  font-size:13px;
  margin-bottom:3px;
}

.access-item small{
  display:block;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

.access-note{
  margin-top:13px;
  padding-top:13px;
  border-top:1px dashed var(--line);
  color:var(--muted);
  font-size:11px;
  line-height:1.55;
}

body.dark .access-overview{
  background:
    radial-gradient(circle at 92% 10%,rgba(34,211,238,.08),transparent 25%),
    linear-gradient(145deg,#1b1723,#211a2e);
}

body.dark .access-item{
  background:#191520;
}

@media(max-width:700px){
  .access-grid{
    grid-template-columns:1fr;
  }
}

</style>
</head>
<body>

<header>
 <div class="nav">
  <a class="brand" href="index.html">
   <img src="https://i.imgur.com/QzPFczP.png" alt="Cooking Gas Tracker & Manager">
   <span>Cooking Gas Tracker & Manager</span>
  </a>
  <div class="navlinks">
   <a href="index.html">Home</a>
   <a href="tracker.html">Tracker</a>
   <a href="assistant.html">Assistant</a>
   <a href="guides.html">Guides</a>
   <a href="more.html">More</a>
  </div>
  <div class="nav-actions">
   <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle theme">🌙</button>
  </div>
 </div>
</header>

<main id="main">
 <div class="loading-screen">Loading your account...</div>
</main>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyAjir7zq8PIzXbDZqfvpRvoWqqYd9udnTU",
 authDomain:"gas-tracker-8e098.firebaseapp.com",
 projectId:"gas-tracker-8e098",
 storageBucket:"gas-tracker-8e098.firebasestorage.app",
 messagingSenderId:"265524187379",
 appId:"1:265524187379:web:d987da967ae8aadc582786"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();

const themeBtn=document.getElementById("themeBtn");
if(localStorage.getItem("cgtTheme")==="dark")document.body.classList.add("dark");
function updateThemeIcon(){themeBtn.textContent=document.body.classList.contains("dark")?"☀️":"🌙"}
updateThemeIcon();
themeBtn.addEventListener("click",()=>{
 document.body.classList.toggle("dark");
 localStorage.setItem("cgtTheme",document.body.classList.contains("dark")?"dark":"light");
 updateThemeIcon();
});

function escapeHtml(value){
 return String(value??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function initials(name,email){
 const source=(name||email||"U").trim();
 const parts=source.split(/\s+/).filter(Boolean);
 if(parts.length>1)return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
 return source.slice(0,2).toUpperCase();
}
function showToast(message){
 const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),2600);
}

function renderPasswordSecurity(user){
 const box=document.getElementById("passwordSecurity");
 if(!box)return;
 const hasPassword=!!user.providerData?.some(p=>p.providerId==="password");
 if(!hasPassword){
  box.innerHTML='<div class="google-managed"><strong>Google sign-in</strong><br>Your password is managed by Google. Change it from your Google Account settings.</div>';
  return;
 }
 box.innerHTML=`<form class="security-form" id="changePasswordForm">
  <div><label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password" required></div>
  <div><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" required></div>
  <div><label for="confirmNewPassword">Confirm new password</label><input id="confirmNewPassword" type="password" autocomplete="new-password" required></div>
  <div class="security-message" id="passwordMessage"></div>
  <button class="btn btn-primary" id="changePasswordBtn" type="submit">Update Password</button>
 </form>`;
 document.getElementById("changePasswordForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const current=document.getElementById("currentPassword").value;
  const next=document.getElementById("newPassword").value;
  const confirm=document.getElementById("confirmNewPassword").value;
  const msg=document.getElementById("passwordMessage"),btn=document.getElementById("changePasswordBtn");
  msg.style.display="none";msg.className="security-message";
  if(next.length<6){msg.textContent="Your new password must be at least 6 characters.";msg.classList.add("error");msg.style.display="block";return}
  if(next!==confirm){msg.textContent="The new passwords do not match.";msg.classList.add("error");msg.style.display="block";return}
  if(next===current){msg.textContent="Your new password must be different from your current password.";msg.classList.add("error");msg.style.display="block";return}
  btn.disabled=true;btn.textContent="Updating...";
  try{
   const cred=firebase.auth.EmailAuthProvider.credential(user.email,current);
   await user.reauthenticateWithCredential(cred);
   await user.updatePassword(next);
   e.target.reset();msg.textContent="Your password has been changed successfully.";msg.classList.add("success");msg.style.display="block";
  }catch(error){
   const map={"auth/wrong-password":"The current password is incorrect.","auth/invalid-credential":"The current password is incorrect.","auth/requires-recent-login":"For security, please sign out and sign in again before changing your password.","auth/weak-password":"The new password is too weak.","auth/network-request-failed":"Network error. Please check your connection and try again."};
   msg.textContent=map[error.code]||"We could not change your password. Please try again.";msg.classList.add("error");msg.style.display="block";
  }finally{btn.disabled=false;btn.textContent="Update Password"}
 });
}

function renderAccount(user){
 const name=user.displayName||"Cooking Gas User";
 const email=user.email||"";
 const verified=user.emailVerified;
 const created=user.metadata?.creationTime?new Date(user.metadata.creationTime):null;
 const joined=created?created.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"}):"—";

 document.getElementById("main").innerHTML=`
  <section class="hero">
   <div class="hero-content">
    <div>
     <span class="hero-badge">👤 MY ACCOUNT</span>
     <h1>Welcome, ${escapeHtml(name.split(" ")[0])}!</h1>
     <p>Your free account brings the personalized Cooking Gas Tracker &amp; Manager features together in one place. Use your profile to personalize your guidance, create and save meal plans, manage shopping, chat with the assistant and keep your account secure.</p>
    </div>
   </div>
  </section>


  <section class="access-overview" aria-labelledby="accessOverviewTitle">
    <h2 id="accessOverviewTitle">What your account gives you access to</h2>
    <p>
      Your account is for the personalized parts of Cooking Gas Tracker &amp; Manager.
      You can still use the general Gas Tracker without an account.
    </p>

    <div class="access-grid">

      <div class="access-item">
        <div class="access-item-icon">🤖</div>
        <div>
          <strong>Cooking Gas Assistant</strong>
          <small>Chat with the assistant and get personalized cooking, gas and household guidance.</small>
        </div>
      </div>

      <div class="access-item">
        <div class="access-item-icon">👨‍🍳</div>
        <div>
          <strong>My Cooking Profile</strong>
          <small>Save your household size, cooking habits, food preferences, budget and goals.</small>
        </div>
      </div>

      <div class="access-item">
        <div class="access-item-icon">🍲</div>
        <div>
          <strong>7-Day Meal Planner</strong>
          <small>Create a personal weekly meal timetable using the information saved in your Cooking Profile.</small>
        </div>
      </div>

      <div class="access-item">
        <div class="access-item-icon">🛒</div>
        <div>
          <strong>Smart Shopping</strong>
          <small>Turn your saved meal plan into an organized shopping list and manage your home inventory.</small>
        </div>
      </div>

    </div>

    <div class="access-note">
      🔒 Your account also includes your sign-in, email verification and account security settings.
    </div>
  </section>

  <section class="grid">
   <div>
    <article class="card">
     <h2>Account information</h2>
     <p class="card-sub">Your current Firebase account details.</p>
     <div class="info-list">
      <div class="info-row">
       <div class="info-label">Full name</div>
       <div class="info-value">${escapeHtml(name)}</div>
      </div>
      <div class="info-row">
       <div class="info-label">Email address</div>
       <div class="info-value">${escapeHtml(email)}</div>
      </div>
      <div class="info-row">
       <div class="info-label">Email verification</div>
       <div class="info-value">
        <span class="status">${verified?"✓ Verified":"⚠ Not verified"}</span>
       </div>
      </div>
      <div class="info-row">
       <div class="info-label">Member since</div>
       <div class="info-value">${escapeHtml(joined)}</div>
      </div>
     </div>

     ${!verified?`
     <div class="notice">
       <strong>Your email is not verified yet.</strong><br>
       Verify your email to help keep your account secure.
       <br><button class="btn btn-primary" id="verifyBtn" style="margin-top:12px">Send verification email</button>
     </div>`:""}

     <article class="card security-card">
      <h2>Security</h2>
      <p class="card-sub">Manage how you protect your account.</p>
      <div id="passwordSecurity"></div>
     </article>
     <button class="btn signout" id="signoutBtn">Sign out</button>
    </article>
   </div>

   <aside>
    <article class="card">
     <h2>Quick access</h2>
     <p class="card-sub">Continue where you want to work.</p>
     <div class="actions">
      <a class="action" href="tracker.html">
       <span class="action-icon">🔥</span><span><strong>Gas Tracker</strong><small>Manage your gas usage and reminders.</small></span><span class="action-arrow">›</span>
      </a>
      <a class="action" href="cooking-profile.html">
       <span class="action-icon">👨‍🍳</span><span><strong>Cooking Profile</strong><small>Manage your cooking preferences.</small></span><span class="action-arrow">›</span>
      </a>
      <a class="action" href="meal-planner.html">
       <span class="action-icon">🍲</span><span><strong>Meal Planner</strong><small>Create and manage your meal plans.</small></span><span class="action-arrow">›</span>
      </a>
      <a class="action" href="smart-shopping.html">
       <span class="action-icon">🛒</span><span><strong>Smart Shopping</strong><small>Manage your shopping list.</small></span><span class="action-arrow">›</span>
      </a>
      <a class="action" href="assistant.html">
       <span class="action-icon">✨</span><span><strong>Cooking Gas Assistant</strong><small>Get personalized guidance.</small></span><span class="action-arrow">›</span>
      </a>
     </div>
    </article>

    <div class="notice">
       <strong>Good to know</strong><br>
       The general Gas Tracker remains available without an account.
       Your account is used for personalized features such as Assistant chat,
       Cooking Profile, Meal Planner and Smart Shopping.
     </div>
   </aside>
  </section>
 `;
 renderPasswordSecurity(user);
 document.getElementById("signoutBtn").addEventListener("click",async()=>{
  try{await auth.signOut();window.location.href="index.html"}
  catch(e){showToast("Could not sign out. Please try again.")}
 });
 const verifyBtn=document.getElementById("verifyBtn");
 if(verifyBtn){
  verifyBtn.addEventListener("click",async()=>{
   try{
    await user.sendEmailVerification();
    showToast("Verification email sent.");
   }catch(e){
    showToast("We couldn't send it right now. Please try again.");
   }
  });
 }
}

auth.onAuthStateChanged(user=>{
 if(!user){
  window.location.href="login.html";
  return;
 }
 renderAccount(user);
});
</script>
</body>
</html>
